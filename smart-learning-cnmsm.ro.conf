# ============================================================
# Nginx config — smart-learning-cnmsm.ro
# Salvează în: /etc/nginx/sites-available/smart-learning-cnmsm.ro
# Apoi rulează:
#   sudo ln -s /etc/nginx/sites-available/smart-learning-cnmsm.ro /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo nginx -s reload
# ============================================================

# ─── Redirect HTTP → HTTPS ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name smart-learning-cnmsm.ro www.smart-learning-cnmsm.ro;

    return 301 https://smart-learning-cnmsm.ro$request_uri;
}

# ─── Redirect www → non-www ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smart-learning-cnmsm.ro;

    ssl_certificate     /etc/letsencrypt/live/smart-learning-cnmsm.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-learning-cnmsm.ro/privkey.pem;

    return 301 https://smart-learning-cnmsm.ro$request_uri;
}

# ─── MAIN — HTTPS ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smart-learning-cnmsm.ro;

    # ── SSL (Let's Encrypt) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/smart-learning-cnmsm.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-learning-cnmsm.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/smartlearning_access.log;
    error_log  /var/log/nginx/smartlearning_error.log;

    # ── Mărimi upload (100MB pt fisiere mari) ────────────────
    client_max_body_size 100M;

    # ── API → Express server (port 3001) ────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Fisiere uploadate → Express server (port 3001) ──────
    location /files/ {
        proxy_pass         http://127.0.0.1:3001/files/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache fisiere statice 1 ora
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── Frontend static (React build) ───────────────────────
    location / {
        root  /var/www/smart-learning-cnmsm.ro/dist;
        index index.html;

        # React Router — toate rutele → index.html
        try_files $uri $uri/ /index.html;

        # Cache html dezactivat (versionare automata)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Cache assets (JS/CSS/imagini) 1 an
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
